# Database tests (B10, B11): applies every migration to a fresh local Supabase database and runs
# supabase/tests/database. Make "Database / test" a required check on main.
name: Database

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/database.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/database.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start the database and apply migrations
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db
      - name: Run overlapping notification claims
        run: python3 supabase/tests/notification_claim_concurrency.py
      - name: Run concurrent block and join checks
        run: python3 supabase/tests/block_join_concurrency.py
  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Install test type-checking dependencies
        run: npm ci --ignore-scripts --prefix supabase/functions
      - name: Typecheck Node tests and shared helpers
        run: npm --prefix supabase/functions run check
      - name: Typecheck the Edge entrypoint and delivery helpers
        run: deno check --no-lock supabase/functions/send-push/index.ts
      - name: Test payloads, JWTs and delivery with fake transport
        run: npm --prefix supabase/functions test
