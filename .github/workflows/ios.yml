  test-ios18:
    name: test-ios18
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Restore SwiftPM cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-

      - name: Generate the project
        run: |
          mkdir -p artifacts
          command -v xcodegen >/dev/null || brew install xcodegen
          cp Config.xcconfig.template Config.xcconfig
          xcodegen generate

      # Compile before booting: the simulator and Swift compiler compete for runner memory.
