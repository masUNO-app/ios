name: iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "MasUno/**"
      - "MasUnoTests/**"
      - "MasUnoUITests/**"
      - "masUNONotifications/**"
      - "Shared/**"
      - "project.yml"
      - "Config.xcconfig.template"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "MasUno/**"
      - "MasUnoTests/**"
      - "MasUnoUITests/**"
      - "masUNONotifications/**"
      - "Shared/**"
      - "project.yml"
      - "Config.xcconfig.template"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep the existing check names. Each runner already includes its exact runtime.
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: test-ios18
            runner: macos-15-intel
            xcode: "26.3"
            ios: "18.6"
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-18-6
          - check: test
            runner: macos-26-intel
            xcode: "26.6"
            ios: "26.5"
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Verify the build environment
        run: |
          mkdir -p artifacts
          {
            xcodebuild -version
            xcrun swiftc --version
            xcrun simctl list runtimes
            df -h .
          } 2>&1 | tee artifacts/environment.log

      - name: Generate the project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cp Config.xcconfig.template Config.xcconfig
          xcodegen generate

      - name: Build the Release app and notification extension
        run: |
          xcodebuild build -quiet -project masUNO.xcodeproj -scheme masUNO \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/release.log

      - name: Boot iPhone 16 Pro on iOS ${{ matrix.ios }}
        timeout-minutes: 10
        env:
          SIMULATOR_RUNTIME: ${{ matrix.runtime }}
        run: |
          simulator=$(xcrun simctl create 'masUNO CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$SIMULATOR_RUNTIME")
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b

      - name: Run all mock unit and UI tests
        run: |
          xcodebuild test -quiet -project masUNO.xcodeproj -scheme masUNO \
            -configuration Debug -destination "id=$SIMULATOR" \
            -derivedDataPath build -resultBundlePath artifacts/tests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/tests.log

      - name: Upload logs, results, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ matrix.ios }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
