        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Boot iPhone 16 Pro on iOS 18.6
        id: boot-simulator
        timeout-minutes: 10
        env:
          SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6
          SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
        run: bash .github/scripts/boot-ios-simulator.sh

      # Swift Testing still runs concurrent tests in-process; disable extra simulator clones.
