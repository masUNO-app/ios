            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/unit-tests.log

      # The accessibility audit runs on iOS 26 and 27; this job checks compatibility. Launch timing is local
      # only: on shared runners its numbers swing with load, and its 6 launches cost a minute of this budget.
      - name: Run mock UI tests
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' && steps.boot-simulator.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          test_runs=(build/Build/Products/*.xctestrun)
