# App builds and tests run on iOS 18.6 and the newest installed iPhone simulator.
# Debug runs on mocks with the template's placeholder keys, so it never calls
# Supabase; LiveIntegrationTests skip themselves without MASUNO_LIVE_PASSWORD. Make "iOS / test" a
# required check on main once it's green.
name: iOS

on:
  pull_request:
    paths: ["MasUno/**", "MasUnoTests/**", "MasUnoUITests/**", "masUNONotifications/**", "Shared/**", "project.yml", "Config.xcconfig.template", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["MasUno/**", "MasUnoTests/**", "MasUnoUITests/**", "masUNONotifications/**", "Shared/**", "project.yml", "Config.xcconfig.template", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Preserve the existing required check name for the newest-OS job.
    name: ${{ matrix.ios == 'latest' && 'test' || 'test-ios18' }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ios: [latest, '18.6']
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cp Config.xcconfig.template Config.xcconfig
          xcodegen generate
      - name: Install the iOS 18 runtime
        if: matrix.ios == '18.6'
        run: |
          if ! xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          available = any(r["version"] == "18.6" and r["isAvailable"] for r in json.load(sys.stdin)["runtimes"])
          sys.exit(0 if available else 1)
          '; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.6
          fi
          xcrun simctl create 'iPhone 16 Pro (iOS 18)' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-6
      - name: Pick the test simulator
        env:
          TEST_IOS: ${{ matrix.ios }}
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          requested = os.environ["TEST_IOS"]
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = tuple(map(int, match.groups()))
              if requested != "latest" and version != tuple(map(int, requested.split("."))):
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, device["udid"], device["name"])
          if best is None:
              raise SystemExit(f"No available iPhone simulator for iOS {requested}")
          print(best[1]); print(best, file=sys.stderr)
          ')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          set -o pipefail
          if ! xcodebuild test -project masUNO.xcodeproj -scheme masUNO \
            -destination "id=$SIMULATOR" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log | tail -n 80; then
            # The tail can omit the compiler's source location; retain useful error context.
            awk '/error:/ { remaining = 12 } remaining > 0 { print; remaining-- }' xcodebuild-test.log
            exit 1
          fi
      - name: Check Release app and extension packaging
        run: |
          set -o pipefail
          xcodebuild build -project masUNO.xcodeproj -scheme masUNO -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ matrix.ios }}
          path: |
            build/Logs/Test/*.xcresult
            xcodebuild-test.log
          if-no-files-found: ignore
          retention-days: 7
