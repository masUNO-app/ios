name: masUNO
options:
  xcodeVersion: "27.2"
  bundleIdPrefix: com.masuno
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6
configs:
  Debug: debug
  Release: release
settings:
  base:
    # Match Xcode's recommended project defaults; keep them when regenerating the project.
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  masUNO:
    type: application
    platform: iOS
    sources:
      - path: MasUno
        excludes:
          - "**/README.md"
          - "AppIcon.icon"
          - "**/*.entitlements"
      - path: Shared
      # Icon Composer bundle: XcodeGen doesn't put it in a build phase by default, so add it by hand.
      - path: MasUno/AppIcon.icon
        buildPhase: resources
    info:
      path: MasUno/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Lets "Open in Maps" offer Google Maps when it's installed (E19).
        LSApplicationQueriesSchemes: [comgooglemaps]
        # HTTPS only, so App Store Connect doesn't ask about export compliance on each upload.
        ITSAppUsesNonExemptEncryption: false
        # Launch color until Arianna's (D3).
        UILaunchScreen:
          UIColorName: Background
        # From Config.xcconfig; read by SupabaseConfig. The anon key is public by design.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # masuno://game/<id> → Event detail. masuno://game/<id>/chat → group chat. masuno://map → the map.
        # masuno://auth-callback → school sign-in (SPEC §8.4).
        NSUserActivityTypes:
          - INSendMessageIntent
        CFBundleURLTypes:
          - CFBundleURLName: com.masuno.app
            CFBundleURLSchemes: [masuno]
    dependencies:
      - package: Supabase
      - target: masUNONotifications
        embed: true
      - sdk: UserNotifications.framework
      - sdk: Intents.framework
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    preBuildScripts:
      - name: Verify archive backend configuration
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          #!/bin/sh
          # CI may compile with placeholders, but an archive must connect to a real backend.
          if [ "${ACTION:-}" != "install" ]; then exit 0; fi
          case "${SUPABASE_URL:-}" in
            *YOUR-*|*"\$("* )
              echo 'error: Archive requires a real Release SUPABASE_URL in Config.xcconfig.'
              exit 1 ;;
            https://?*) ;;
            *)
              echo 'error: Archive requires an HTTPS Release SUPABASE_URL in Config.xcconfig.'
              exit 1 ;;
          esac
          case "${SUPABASE_ANON_KEY:-}" in
            ''|*YOUR-*|*"\$("* )
              echo 'error: Archive requires a real Release SUPABASE_ANON_KEY in Config.xcconfig.'
              exit 1 ;;
          esac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masuno.app
        DEVELOPMENT_TEAM: PU87MU4QAR # Boys & Girls Clubs of Chicago
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: masUNO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "masUNO uses your location to show how far games are. It's never shared with other people."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: MasUno/MasUno.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: MasUno/MasUno.Release.entitlements
  masUNONotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: masUNONotifications
        excludes:
          - Info.plist
          - Samples
          - "**/*.entitlements"
          - "**/*.apns"
      - path: Shared
    info:
      path: masUNONotifications/Info.plist
      properties:
        CFBundleDisplayName: masUNO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # xcodegen rewrites this plist from these properties, so the extension point has to live here.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: Intents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masuno.app.NotificationService
        DEVELOPMENT_TEAM: PU87MU4QAR
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: masUNONotifications/Info.plist
        CODE_SIGN_ENTITLEMENTS: masUNONotifications/masUNONotifications.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  masUNOTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasUnoTests
    dependencies:
      - target: masUNO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masuno.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  masUNOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MasUnoUITests
    dependencies:
      - target: masUNO
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.masuno.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  masUNO:
    build:
      targets:
        masUNO: all
        masUNONotifications: all
        masUNOTests: [test]
        masUNOUITests: [test]
    run:
      config: Debug
      # Debug runs against masuno-dev (Debug keys in Config.xcconfig). Untick it in the scheme to run
      # on in-memory mocks; without real keys the app falls back to mocks by itself.
      commandLineArguments:
        "-liveAuth YES": true
    test:
      config: Debug
      targets:
        - masUNOTests
        - masUNOUITests
      # Unit tests stay on mocks: their host app never calls the backend.
      commandLineArguments:
        "-liveAuth NO": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
