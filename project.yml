name: MasUno
options:
  bundleIdPrefix: com.masuno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  MasUno:
    type: application
    platform: iOS
    sources:
      - path: MasUno
        excludes:
          - "**/README.md"
    info:
      path: MasUno/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Lets "Open in Maps" offer Google Maps when it's installed (E19).
        LSApplicationQueriesSchemes: [comgooglemaps]
        # Launch color until Arianna's (D3).
        UILaunchScreen:
          UIColorName: Background
        # From Config.xcconfig; read by SupabaseConfig. The anon key is public by design.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # masuno://game/<id> → Event detail (SPEC E3; used by 1.0 notifications).
        # masuno://auth-callback → school sign-in (SPEC §8.4).
        CFBundleURLTypes:
          - CFBundleURLName: com.masuno.app
            CFBundleURLSchemes: [masuno]
    dependencies:
      - package: Supabase
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masuno.app
        DEVELOPMENT_TEAM: PU87MU4QAR # Boys & Girls Clubs of Chicago
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: masUNO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "masUNO uses your location to show how far games are. It's never shared with other people."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: "0.6"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  MasUnoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasUnoTests
    dependencies:
      - target: MasUno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masuno.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  MasUno:
    build:
      targets:
        MasUno: all
        MasUnoTests: [test]
    run:
      config: Debug
      # Debug runs against masuno-dev (Debug keys in Config.xcconfig). Untick it in the scheme to run
      # on in-memory mocks; without real keys the app falls back to mocks by itself.
      commandLineArguments:
        "-liveAuth YES": true
    test:
      config: Debug
      targets:
        - MasUnoTests
      # Unit tests stay on mocks: their host app never calls the backend.
      commandLineArguments:
        "-liveAuth NO": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
