project_id = "masuno"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "masuno://auth-callback"
additional_redirect_urls = ["masuno://auth-callback"]
enable_signup = true
# Matches the app's own check (OnboardingViewModel.minimumPasswordLength). Hosted projects set it in
# Dashboard → Auth → Providers → Email (README).
minimum_password_length = 8

# The real sign-up gate (SPEC §8.4). Hosted projects register it in Dashboard → Auth → Hooks.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

# Sign-up is a school email and a password (N36), proven by a 6-digit code in the confirmation
# email (N39). The hook limits who can sign up; entering the code puts the account on the waitlist
# (or straight in while `signup_auto_approve` is on). Password resets send the same kind of code.
# Hosted projects set all of this in Dashboard → Auth (README, hosted checklist). Locally the emails
# land in Mailpit: http://localhost:54324.
[auth.email]
enabled = true
enable_confirmations = true
otp_length = 6
otp_expiry = 900
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Your masUNO code / Tu código de masUNO"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your masUNO password / Restablece tu contraseña de masUNO"
content_path = "./supabase/templates/recovery.html"

# School SSO, unused while sign-in is email and password (N36). Off locally by default: the Entra app only lists the hosted projects' callback URLs (B2).
# `enabled` is left undeclared on purpose, so `supabase config push` doesn't switch off the
# provider that's turned on in the hosted dashboards. Never use the "common" tenant, which
# admits personal Microsoft accounts.
[auth.external.azure]
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
url = "https://login.microsoftonline.com/organizations"

[functions.delete-account]
verify_jwt = true

# The cron job calls this with the service-role key. The function also compares the key itself,
# so it stays closed if someone deploys it with --no-verify-jwt.
[functions.send-push]
verify_jwt = true
