project_id = "masuno"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "masuno://auth-callback"
additional_redirect_urls = ["masuno://auth-callback"]
enable_signup = true

# The real sign-up gate (SPEC §8.4). Hosted projects register it in Dashboard → Auth → Hooks.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

# Review passwords need the email provider on; the hook keeps it allowlist-only.
[auth.email]
enabled = true
enable_confirmations = false

# Off locally by default: the Entra app only lists the hosted projects' callback URLs (B2).
# `enabled` is left undeclared on purpose, so `supabase config push` doesn't switch off the
# provider that's turned on in the hosted dashboards. Never use the "common" tenant, which
# admits personal Microsoft accounts.
[auth.external.azure]
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
url = "https://login.microsoftonline.com/organizations"

[functions.delete-account]
verify_jwt = true
